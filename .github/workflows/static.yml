usdDelta.textContent = signUsd + ' ' + fmt(Math.abs(pctUsd)) + '% vs ' + data.previous.date;
      eurDelta.textContent = signEur + ' ' + fmt(Math.abs(pctEur)) + '% vs ' + data.previous.date;
      usdDelta.className = 'card-delta ' + (pctUsd >= 0 ? 'up' : 'down');
      eurDelta.className = 'card-delta ' + (pctEur >= 0 ? 'up' : 'down');

      statusBadge.classList.remove('offline');
      statusDot.classList.remove('offline');
      statusText.textContent = 'En vivo';

      document.getElementById('footer').innerHTML =
        'Actualizado: ' + new Date().toLocaleString('es-VE') +
        ' · Fuente: <a href="https://www.bcv.org.ve" target="_blank">BCV</a> vía DolarVzla';

      updateConverter();

    } catch (err) {
      console.error(err);
      usdEl.classList.remove('loading');
      eurEl.classList.remove('loading');
      usdEl.textContent = fmt(rates.usd || 0);
      eurEl.textContent = fmt(rates.eur || 0);
      errorMsg.classList.add('visible');
      statusBadge.classList.add('offline');
      statusDot.classList.add('offline');
      statusText.textContent = 'Sin conexión';
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.style.opacity = '1';
    }
  }

  // ─── CONVERSOR ───
  const amountInput = document.getElementById('amount');
  const fromSelect = document.getElementById('fromCurrency');
  const resultValue = document.getElementById('resultValue');
  const rateInfo = document.getElementById('rateInfo');

  function updateConverter() {
    const amt = parseFloat(amountInput.value) || 0;
    const cur = fromSelect.value;
    const rate = rates[cur];
    if (!rate) { resultValue.textContent = '—'; rateInfo.textContent = 'Esperando datos...'; return; }
    const total = amt * rate;
    resultValue.textContent = fmt(total) + ' Bs';
    rateInfo.textContent = 'Tasa aplicada: ' + fmt(rate) + ' Bs/' + cur.toUpperCase();
  }
  amountInput.addEventListener('input', updateConverter);
  fromSelect.addEventListener('change', updateConverter);

  // ─── AUTO-REFRESH ───
  function toggleAuto() {
    const btn = document.getElementById('autoBtn');
    if (isAuto) {
      clearInterval(autoInterval);
      isAuto = false;
      btn.innerHTML = <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Auto: OFF;
    } else {
      fetchRates();
      autoInterval = setInterval(fetchRates, 60000); // cada 60 segundos
      isAuto = true;
      btn.innerHTML = <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Auto: ON;
    }
  }

  // ─── INICIO ───
  fetchRates();
</script>
</body>
</html>
